pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  chunk:
    size: 500
    overlap: 50
  retry-lock-seconds: 10

# SSE 流式对话超时配置（毫秒）
sse:
  timeout: 300000

# RAG 检索配置
rag:
  max-results: 5
  min-score-threshold: 0.05
  rerank:
    enabled: true
    chunk-threshold: 100
    top-n: 5
    candidate-multiplier: 3
    base-url: https://llm-c36pjigszb7ajl5e.cn-beijing.maas.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    api-key: sk-770db1ffaa7e4fff80ed1f95259b121f
    model-name: qwen3.7-text-rerank
# 输入清洗长度限制
guard:
  max-question-length: 2000
  max-custom-text-length: 5000

# Token 过期时间（小时）
token:
  expire-hours: 1

# BM25 编码器配置
bm25:
  redis-pipeline-batch-size: 500
  drift-threshold: 20

# 会话标题最大长度
chat:
  title-max-length: 50
  memory:
    max-messages: 6
    summary-interval: 6
    summary-expire-days: 30

# Qdrant 向量检索阈值配置
qdrant:
  dense:
    score-threshold: 0.30
  sparse:
    score-threshold: 1.0

mcp:
  server:
    search:
      base-url: https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp
  aliyun:
    api-key: sk-770db1ffaa7e4fff80ed1f95259b121f