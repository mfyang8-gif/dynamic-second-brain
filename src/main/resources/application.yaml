server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yaml
  profiles:
    active: dev
  servlet:
    multipart:
      # 容器上限刻意大于业务层最大限制（SOURCE=20MB），
      # 让业务超限走 ValidationException 友好报错，MaxUploadSizeExceededException 仅兜底防恶意大包
      max-file-size: 25MB
      max-request-size: 30MB
    encoding:
      charset: UTF-8
      force: true
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.88.130}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
    listener:
      simple:
        # 消费端 catch-all 兜底，毒消息不无限 requeue（本轮丢弃降级）
        default-requeue-rejected: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://192.168.88.130:3306/dynamic_brain?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:192.168.88.130}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
    qdrant:
      host: ${QDRANT_HOST:192.168.88.130}
      port: 6334
      http-port: 6333
      use-tls: false
      collections:
        # 第 1 个集合：动态第二大脑知识库
        - name: dynamic_brain
          dimension: 1024
          indexes:
            - name: bookId
              type: keyword
            - name: userId
              type: keyword
            - name: pageId
              type: keyword
            - name: createdAt
              type: integer
        # 第 2 个集合：用户习惯语义查重向量索引（MySQL 为 source of truth，Qdrant 仅作查重索引）
        - name: user_semantic_habits
          dimension: 1024
          indexes:
            - name: user_id
              type: integer
            - name: fact_hash
              type: keyword
    web:
      resources:
        add-mappings: true
mfyang:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:this-is-a-secure-admin-secret-key-at-least-32-chars}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:this-is-a-secure-user-secret-key-at-least-32-chars}
    user-ttl: 7200000
    user-token-name: authorization
  alioss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET:mini-notepad}
    presign-expire-hours: 2
# LangChain4j
langchain4j:
  open-ai:
    streaming-chat-model:
      api-key: ${VOLC_API_KEY}
      model-name: doubao-seed-2-0-pro-260215
      base-url: https://ark.cn-beijing.volces.com/api/v3
      log-requests: true
      log-responses: true
      timeout: 240s
      streaming: true
      max-tokens: 8192
      temperature: 0.7
    chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      base-url: https://api.deepseek.com
      log-requests: true
      log-responses: true
      timeout: 120s
      streaming: true
      temperature: 0.7
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY}
      model-name: text-embedding-v4
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
      timeout: 120s
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: qwen-turbo


pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  chunk:
    size: 500
    overlap: 50
  retry-lock-seconds: 10

# SSE 流式对话超时配置（毫秒）
sse:
  timeout: 300000

# RAG 检索配置
rag:
  max-results: 5
  min-score-threshold: 0.05
  rerank:
    enabled: true
    chunk-threshold: 100
    top-n: 5
    candidate-multiplier: 3
    base-url: https://llm-c36pjigszb7ajl5e.cn-beijing.maas.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    api-key: ${RERANK_API_KEY}
    model-name: qwen3.7-text-rerank
  # 双路并发 + 两段流式（2026-10-12 用户终版裁决：结构根治，废弃串行漏斗与判卷器）
  dual-path:
    # 总开关：false 时完全回到「只答知识库 + 未命中就声明」的老行为（回滚用）
    enabled: true
    # 本地通路就绪等待上限：超时视为本地不可用，不开 Pass1（不拖慢首字）
    local-ready-timeout-ms: 4000
    # 联网通路总预算：超过即放弃等联网，直接收尾
    web-budget-ms: 30000
    # Pass1 是否开启的余弦底线（真实余弦 0~1）。
    # ⚠️ 只能作用在纯稠密通道的分数上 —— 主链路的 RRF 分数（0.01~0.03）与余弦不可比，
    #    拿它跟 0.28 比会 100% 误判成"本地没料"。
    pass1-cosine-gate: 0.28
    # Pass1 软预算（字数）：第一段写到这里就该收束，把空间留给 Pass2
    pass1-soft-budget-chars: 400
    # 单次 Pass 的兜底超时（防 LLM 流悬挂把虚拟线程永久占住）
    pass-timeout-ms: 180000
# 输入清洗长度限制
guard:
  max-question-length: 2000
  max-custom-text-length: 5000

# Token 过期时间（小时）
token:
  expire-hours: 1

# BM25 编码器配置
bm25:
  redis-pipeline-batch-size: 500
  drift-threshold: 20

# 会话标题最大长度
chat:
  title-max-length: 50
  memory:
    max-messages: 6
    summary-interval: 6
    summary-expire-days: 30
  suggestion:
    max-answer-length: 500

# 全局语义记忆（Phase 3 终极版）：向量语义查重配置
semantic:
  dedup:
    # 方案 B：本值已从「判定阈值」降级为「召回阈值」——只要进这个分数线就交给 LLM 裁决，
    # 因此必须大幅放宽（0.60）确保同义句不漏；真正的同一性判断在 semantic.judge 那一步。
    similarity-threshold: 0.60
    # 宽松召回条数：只把最相近的 3 条喂给 LLM 仲裁，控制其上下文窗口与判定噪音
    recall-limit: 3
    collection-name: user_semantic_habits
  # LLM 仲裁器（HabitJudge）：二值逻辑判定，独立模型参数便于单独调优
  judge:
    model-name: qwen-turbo
    temperature: 0.0

# Qdrant 向量检索阈值配置
qdrant:
  # 主检索集合名（联网降级第一层走原生稠密通道时同样要指名集合）
  collection-name: dynamic_brain
  dense:
    score-threshold: 0.30
  sparse:
    score-threshold: 1.0
workspace:
  sse:
    timeout: 3600000
    heartbeat-interval-seconds: 15
mcp:
  server:
    search:
      base-url: https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp
  aliyun:
    api-key: ${MCP_ALIYUN_API_KEY}

studio:
  pandoc:
    api-url: ${PANDOC_API_URL:http://192.168.88.130:8000/api/convert}

web-search:
  default-limit: 6
  max-limit: 10
  recall-multiplier: 3
  # 预检索注入（双路并发的联网侧）
  pre-search-limit: 5          # 单条搜索词取回几条网页
  pre-search-max-queries: 2    # 最多并发几条搜索词
  pre-search-context-top-n: 5  # 最终注入上下文保留几条来源
  pre-search-timeout-ms: 8000  # 单路搜索等待上限
  # 注入防护三道工序（用户 2026-10-12 裁决：外网内容零信任）
  guard:
    enabled: true              # 隔离 + 消毒总开关
    blacklist-enabled: true    # 检出即丢弃开关（关掉只做隔离消毒，不丢来源）
  # 语义去重：跨站转载只留一条（URL 级去重拦不住转载）
  dedup:
    enabled: true
    coarse-threshold: 0.85     # 字符级 Jaccard 粗筛，命中才调 embedding
    semantic-threshold: 0.92   # 向量余弦精判，超过判为转载重复

# Actuator / Micrometer（用户 2026-10-12 裁决：只暴露 metrics,health，走免登白名单）
management:
  endpoints:
    web:
      exposure:
        include: metrics,health
  endpoint:
    health:
      show-details: never

# 日志编码显式钉死 UTF-8。
# 背景（2026-10-12 实测）：本机控制台代码页是 GBK，而应用按 UTF-8 写 stdout；
# 上游若按 mbcs 解码，日志里所有中文都会变成"鑱旂綉棰勬绱"这类不可逆乱码——
# 双路/降级链路的排障严重依赖中文日志（notice 原因、Pass 打点），必须修掉。
logging:
  charset:
    console: UTF-8
    file: UTF-8

# ===== Phase 4 · Graphiti 记忆微服务（B0 契约层，2026-10-13）=====
# ⚠️ B0 阶段只交付契约层（配置 + DTO + Client），工程内没有任何调用点：
#    三个开关默认全关，确保 B1 半成品上线时不会被误触发（灰度三开关见设计文档 §5.1）。
graphiti:
  enabled: false                    # 总开关，B1 起逐层打开
  base-url: ${GRAPHITI_BASE_URL:http://192.168.88.130:8088}
  write:
    enabled: false                  # 写入链（MQ 消费侧）
    judge-enabled: false            # 实质判定走 LLM；关则全走规则快通道
  recall:
    enabled: false                  # 召回链（在线路径）
    # ★ 宽拉取倍数（补丁 2）：/search 不过滤 invalid_at，
    #   不放大就会出现「匹配度最高的 N 条全已作废 → 召回为空」。约束 >= 1，基线 4。
    fetch-factor: 4
    unsettled-window-minutes: 15    # L1「未沉淀原文」时间窗兜底（§4.1 风险二）
  timeout:                          # §2.5：读操作必须远短于写操作
    recall-connect-ms: 1000
    recall-read-ms: 2000            # 召回阻塞 SSE 首字，超时即降级为「无记忆」
    write-connect-ms: 2000
    write-read-ms: 5000            # 只要 202 到手即可
    confirm-connect-ms: 1000
    confirm-read-ms: 3000           # 对账定时任务，不阻塞任何用户路径