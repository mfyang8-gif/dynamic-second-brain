server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    encoding:
      charset: UTF-8
      force: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.88.130:3306/dynamic_brain?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  data:
    redis:
      host: 192.168.88.130
      port: 6379
      password:
      database: 0
      timeout: 10000ms
    qdrant:
      host: 192.168.88.130
      port: 6334
      http-port: 6333
      use-tls: false
      collections:
        # 第 1 个集合：动态第二大脑知识库
        - name: dynamic_brain
          dimension: 1536
          indexes:
            - name: bookId
              type: keyword
            - name: userId
              type: keyword
            - name: createdAt
              type: integer
    web:
      resources:
        add-mappings: true
mfyang:
  jwt:
    admin-secret-key: this-is-a-secure-admin-secret-key-at-least-32-chars

    admin-ttl: 7200000

    admin-token-name: token
    user-secret-key: this-is-a-secure-user-secret-key-at-least-32-chars
    user-ttl: 7200000
    user-token-name: authorization
