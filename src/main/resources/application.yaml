server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yaml
  profiles:
    active: dev
  servlet:
    multipart:
      # 容器上限刻意大于业务层最大限制（SOURCE=20MB），
      # 让业务超限走 ValidationException 友好报错，MaxUploadSizeExceededException 仅兜底防恶意大包
      max-file-size: 25MB
      max-request-size: 30MB
    encoding:
      charset: UTF-8
      force: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://192.168.88.130:3306/dynamic_brain?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:192.168.88.130}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
    qdrant:
      host: ${QDRANT_HOST:192.168.88.130}
      port: 6334
      http-port: 6333
      use-tls: false
      collections:
        # 第 1 个集合：动态第二大脑知识库
        - name: dynamic_brain
          dimension: 1024
          indexes:
            - name: bookId
              type: keyword
            - name: userId
              type: keyword
            - name: pageId
              type: keyword
            - name: createdAt
              type: integer
    web:
      resources:
        add-mappings: true
mfyang:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:this-is-a-secure-admin-secret-key-at-least-32-chars}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:this-is-a-secure-user-secret-key-at-least-32-chars}
    user-ttl: 7200000
    user-token-name: authorization
  alioss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET:mini-notepad}
    presign-expire-hours: 2
# LangChain4j
langchain4j:
  open-ai:
    streaming-chat-model:
      api-key: ${VOLC_API_KEY}
      model-name: doubao-seed-2-0-pro-260215
      base-url: https://ark.cn-beijing.volces.com/api/v3
      log-requests: true
      log-responses: true
      timeout: 240s
      streaming: true
      max-tokens: 8192
      temperature: 0.7
    chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      base-url: https://api.deepseek.com
      log-requests: true
      log-responses: true
      timeout: 120s
      streaming: true
      temperature: 0.7
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY}
      model-name: text-embedding-v4
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
      timeout: 120s
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: qwen-turbo


pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  chunk:
    size: 500
    overlap: 50
  retry-lock-seconds: 10

# SSE 流式对话超时配置（毫秒）
sse:
  timeout: 300000

# RAG 检索配置
rag:
  max-results: 5
  min-score-threshold: 0.05
  rerank:
    enabled: true
    chunk-threshold: 100
    top-n: 5
    candidate-multiplier: 3
    base-url: https://llm-c36pjigszb7ajl5e.cn-beijing.maas.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    api-key: ${RERANK_API_KEY}
    model-name: qwen3.7-text-rerank
# 输入清洗长度限制
guard:
  max-question-length: 2000
  max-custom-text-length: 5000

# Token 过期时间（小时）
token:
  expire-hours: 1

# BM25 编码器配置
bm25:
  redis-pipeline-batch-size: 500
  drift-threshold: 20

# 会话标题最大长度
chat:
  title-max-length: 50
  memory:
    max-messages: 6
    summary-interval: 6
    summary-expire-days: 30
  suggestion:
    max-answer-length: 500

# Qdrant 向量检索阈值配置
qdrant:
  dense:
    score-threshold: 0.30
  sparse:
    score-threshold: 1.0
workspace:
  sse:
    timeout: 3600000
    heartbeat-interval-seconds: 15
mcp:
  server:
    search:
      base-url: https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp
  aliyun:
    api-key: ${MCP_ALIYUN_API_KEY}

studio:
  pandoc:
    api-url: ${PANDOC_API_URL:http://192.168.88.130:8000/api/convert}